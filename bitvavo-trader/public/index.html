<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0d13" />
    <title>Bitvavo Trader</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/panels.css" />
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="#live" aria-label="Bitvavo Trader – naar Live">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="bl-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4f86ff" />
              <stop offset="1" stop-color="#2a55d8" />
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#bl-g)" />
          <path d="M10 7v4M10 21v4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
          <rect x="7.5" y="11" width="5" height="10" rx="1.2" fill="#fff" />
          <path d="M22 5v5M22 19v7" stroke="#bcd0ff" stroke-width="1.6" stroke-linecap="round" />
          <rect x="19.5" y="10" width="5" height="9" rx="1.2" fill="#bcd0ff" />
        </svg>
        <span class="brand-text">
          <span class="brand-name">Bitvavo Trader</span>
          <span class="brand-sub" id="brand-sub">daytrading-bot</span>
        </span>
      </a>

      <nav class="nav-tabs" role="tablist" aria-label="Hoofdmenu">
        <button type="button" role="tab" data-tab="live">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18" /><path d="m7 15 4-4 3 3 5-6" /></svg>
          Live
        </button>
        <button type="button" role="tab" data-tab="backtest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6" /><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3" /><path d="M7.5 15h9" /></svg>
          Backtest-lab
        </button>
        <button type="button" role="tab" data-tab="scanner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /><path d="M8 11h6M11 8v6" /></svg>
          Scanner
        </button>
        <button type="button" role="tab" data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" /><circle cx="16" cy="6" r="2" /><circle cx="10" cy="12" r="2" /><circle cx="18" cy="18" r="2" /></svg>
          Instellingen
        </button>
      </nav>

      <div class="header-right">
        <div id="conn-status" class="conn connecting" role="status" title="Verbinding met de bot">
          <span class="dot"></span><span class="conn-text">Verbinden…</span>
        </div>
        <div id="bot-controls" class="bot-controls" aria-label="Bot bediening"></div>
      </div>
    </header>

    <div id="mode-banner" class="mode-banner" aria-live="polite">
      <span class="mb-main"><span class="spinner"></span> Status laden…</span>
    </div>
    <div id="alert-banners" class="alert-banners" hidden></div>

    <section id="header-stats" class="stats-bar" aria-label="Accountoverzicht"></section>

    <main class="app-main">
      <section id="tab-live" class="tab-page" role="tabpanel" aria-label="Live">
        <div class="live-grid">
          <div class="live-col live-main">
            <div id="market-tabs" class="market-tabs" role="tablist" aria-label="Markten"></div>
            <div class="panel chart-panel">
              <div id="chart-toolbar" class="chart-toolbar"></div>
              <div id="chart-stack" class="chart-stack">
                <div id="chart-main" class="chart-pane chart-pane-main"></div>
                <div id="chart-rsi" class="chart-pane chart-pane-sub"></div>
                <div id="chart-macd" class="chart-pane chart-pane-sub chart-pane-last"></div>
              </div>
            </div>
            <section id="panel-positions" class="panel" aria-label="Open posities"></section>
            <section id="panel-trades" class="panel" aria-label="Laatste trades"></section>
          </div>

          <aside class="live-col live-side">
            <section id="panel-signals" class="panel slot" aria-label="Signalen">
              <div class="panel-loading"><span class="spinner"></span></div>
            </section>
            <section id="panel-risk" class="panel slot" aria-label="Risico">
              <div class="panel-loading"><span class="spinner"></span></div>
            </section>
            <section id="panel-equity" class="panel slot" aria-label="Equity">
              <div class="panel-loading"><span class="spinner"></span></div>
            </section>
          </aside>

          <div class="live-col live-logcol">
            <section id="panel-log" class="panel live-log" aria-label="Logboek"></section>
          </div>
        </div>
      </section>

      <section id="tab-backtest" class="tab-page" role="tabpanel" aria-label="Backtest-lab" hidden>
        <div id="backtest-root" class="tab-root"></div>
      </section>

      <section id="tab-scanner" class="tab-page" role="tabpanel" aria-label="Scanner" hidden>
        <div id="scanner-root" class="tab-root"></div>
      </section>

      <section id="tab-settings" class="tab-page" role="tabpanel" aria-label="Instellingen" hidden>
        <div id="settings-root" class="tab-root"></div>
      </section>
    </main>

    <footer class="app-footer">
      <span>
        <strong>Geen financieel advies.</strong> Crypto is zeer risicovol; je kunt je hele inzet verliezen.
        Resultaten uit het verleden (en backtests) bieden geen garantie voor de toekomst.
      </span>
      <span>
        <span id="footer-version">Bitvavo Trader</span> · Grafieken:
        <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView Lightweight Charts™</a>
      </span>
    </footer>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="/vendor/lightweight-charts.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
