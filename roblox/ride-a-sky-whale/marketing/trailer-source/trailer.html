<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(Fredoka.ttf); font-weight: 300 700; }
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
svg { display: block; }
.t { font-family: Fredoka, sans-serif; font-weight: 700; paint-order: stroke; stroke-linejoin: round; text-anchor: middle; }
</style></head><body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyTop" offset="0" stop-color="#3D8FE0"/><stop id="skyBot" offset="1" stop-color="#CDEBFF"/>
    </linearGradient>
    <linearGradient id="whaleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5287BA"/><stop offset="1" stop-color="#2F5F8E"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46FFB4" stop-opacity="0"/><stop offset=".3" stop-color="#46FFB4"/><stop offset=".7" stop-color="#9B6BFF"/><stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <g id="cloudShape"><circle cx="-60" cy="10" r="38"/><circle cx="0" cy="-12" r="52"/><circle cx="62" cy="8" r="40"/><rect x="-98" y="10" width="200" height="40" rx="20"/></g>
    <g id="whaleShape">
      <path d="M70 270 C80 190 160 150 300 140 C480 125 640 140 780 200 C830 222 860 238 890 244 C905 220 925 180 958 158 C950 200 935 235 920 255 C940 285 955 320 962 345 C925 320 905 290 888 272 C820 300 720 330 600 345 C430 365 260 365 160 335 C110 320 75 300 70 270 Z" fill="url(#whaleGrad)" stroke="#1C3D5C" stroke-width="7"/>
      <path d="M95 305 C160 330 260 352 400 352 C500 352 560 345 640 332 C560 352 430 366 300 362 C220 358 140 340 95 305 Z" fill="#B7D0E6"/>
      <path d="M285 352 C330 395 390 430 455 442 C425 415 385 385 350 360 Z" fill="#3F6E9C" stroke="#1C3D5C" stroke-width="6"/>
      <path d="M78 282 C125 300 185 305 250 292" fill="none" stroke="#1C3D5C" stroke-width="8" stroke-linecap="round"/>
      <circle cx="185" cy="236" r="17" fill="#13243A"/>
      <circle cx="191" cy="229" r="6" fill="#FFFFFF"/>
      <ellipse cx="150" cy="268" rx="20" ry="11" fill="#F5A3B5" opacity=".7"/>
      <ellipse cx="241" cy="148" rx="16" ry="5" fill="#13243A"/>
      <g fill="#C99A55" stroke="#7A5530" stroke-width="4">
        <path d="M380 140 Q400 160 420 140 Z"/><path d="M450 136 Q470 156 490 136 Z"/><path d="M520 139 Q540 159 560 139 Z"/><path d="M590 148 Q610 168 630 148 Z"/>
      </g>
    </g>
    <path id="spark" d="M0,-1 C.14,-.14 .14,-.14 1,0 C.14,.14 .14,.14 0,1 C-.14,.14 -.14,.14 -1,0 C-.14,-.14 -.14,-.14 0,-1Z"/>
  </defs>

  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <g id="stars"></g>
  <g id="aurora" opacity="0">
    <path d="M-200 300 C300 150 700 420 1100 250 C1500 90 1800 300 2200 200 L2200 330 C1800 430 1500 220 1100 380 C700 540 300 280 -200 430 Z" fill="url(#auroraGrad)" filter="url(#blur30)"/>
    <path d="M-200 160 C400 60 800 260 1200 140 C1600 20 1900 180 2200 100 L2200 190 C1900 270 1600 110 1200 230 C800 350 400 150 -200 250 Z" fill="url(#auroraGrad)" filter="url(#blur30)" opacity=".7"/>
  </g>
  <g id="sunGroup">
    <circle id="corona" cx="1520" cy="210" r="132" fill="none" stroke="#B05CFF" stroke-width="26" filter="url(#blur10)" opacity="0"/>
    <circle id="sun" cx="1520" cy="210" r="110" fill="#FFE27A"/>
    <circle id="moon" cx="1800" cy="120" r="112" fill="#07030D" opacity="0"/>
  </g>
  <g id="bgClouds"></g>
  <g id="lightning" opacity="0">
    <path d="M1180 -10 L1120 160 L1170 160 L1090 360 L1230 140 L1170 140 L1230 -10 Z" fill="#FFF7B0" stroke="#FFFFFF" stroke-width="6"/>
  </g>

  <g id="world">
    <g id="worldClouds"></g>
    <g id="whaleWrap"><use href="#whaleShape"/></g>
    <g id="sprayGroup" fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path id="spray1" stroke-width="12"/><path id="spray2" stroke-width="12"/><path id="spray3" stroke-width="12"/>
    </g>
    <g id="driftlings"></g>
    <g id="avatar">
      <g id="wings" fill="#FFFFFF" stroke="#7FA6C9" stroke-width="2">
        <path d="M-6 -28 L-34 -22 L-6 -18 Z"/><path d="M6 -28 L34 -22 L6 -18 Z"/>
      </g>
      <rect x="-7" y="-14" width="6" height="14" fill="#3FA34D"/><rect x="1" y="-14" width="6" height="14" fill="#3FA34D"/>
      <rect x="-8" y="-28" width="16" height="15" fill="#2F7DE0"/>
      <rect x="-13" y="-28" width="5" height="13" fill="#F5CD30"/><rect x="8" y="-28" width="5" height="13" fill="#F5CD30"/>
      <rect x="-6" y="-40" width="12" height="12" rx="2" fill="#F5CD30"/>
      <circle cx="-2.5" cy="-35.5" r="1.3" fill="#222"/><circle cx="2.5" cy="-35.5" r="1.3" fill="#222"/>
      <path d="M-3 -32 Q0 -30 3 -32" fill="none" stroke="#222" stroke-width="1"/>
    </g>
    <g id="popTexts"></g>
  </g>

  <g id="speedLines" stroke="#FFFFFF" stroke-linecap="round"></g>
  <g id="rain" stroke="#C9D6EE" stroke-width="3" stroke-linecap="round"></g>
  <g id="snow" fill="#FFFFFF"></g>
  <g id="motes" fill="#C08AFF"></g>
  <g id="seaClouds"></g>

  <rect id="darken" width="1920" height="1080" fill="#0A0414" opacity="0"/>
  <g id="eyeGlow" opacity="0"><circle id="eyeGlowC" r="40" fill="#C27BFF" filter="url(#blur10)"/></g>
  <g id="special"></g>
  <rect id="flash" width="1920" height="1080" fill="#FFFFFF" opacity="0"/>

  <g id="captions">
    <text id="c1" class="t" x="960" y="470" font-size="96" fill="#FFFFFF" stroke="#1C3D6C" stroke-width="18">What if your world could...</text>
    <text id="c2" class="t" x="960" y="700" font-size="230" fill="#FFE27A" stroke="#1C3D6C" stroke-width="28">FLY?</text>
    <text id="c3" class="t" x="960" y="1000" font-size="84" fill="#FFFFFF" stroke="#1C3D6C" stroke-width="16">Live on a giant SKY WHALE</text>
    <text id="c4" class="t" x="960" y="1000" font-size="84" fill="#FFFFFF" stroke="#1C3D6C" stroke-width="16">Launch from the blowhole!</text>
    <text id="c5" class="t" x="960" y="1000" font-size="84" fill="#FFFFFF" stroke="#1C3D6C" stroke-width="16">Glide and catch Driftlings</text>
    <text id="c6" class="t" x="960" y="140" font-size="80" fill="#FFFFFF" stroke="#1C2440" stroke-width="16">A NEW SKY every 10 minutes</text>
    <text id="c7" class="t" x="960" y="1000" font-size="78" fill="#FFFFFF" stroke="#1C2440" stroke-width="16"></text>
    <text id="c8" class="t" x="960" y="1000" font-size="88" fill="#E7C8FF" stroke="#1A0830" stroke-width="18">Don't miss the ECLIPSE</text>
    <text id="c9" class="t" x="1460" y="600" font-size="110" fill="#C27BFF" stroke="#1A0830" stroke-width="18">VOID x25</text>
    <text id="c10" class="t" x="960" y="250" font-size="170" fill="#FFFFFF" stroke="#1C3D6C" stroke-width="30">RIDE A SKY WHALE</text>
    <text id="c11" class="t" x="960" y="940" font-size="88" fill="#FFE27A" stroke="#1C3D6C" stroke-width="18">Play FREE on Roblox</text>
    <text id="c12" class="t" x="960" y="1035" font-size="54" fill="#FFFFFF" stroke="#1C3D6C" stroke-width="12">Code: WHALEHELLO</text>
  </g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const smooth = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); };
const easeOutCubic = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const easeOutBack = u => { u = clamp(u, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
function rnd(i, k) { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixColor(a, b, x) { const A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], x))).join(',') + ')'; }
function win(t, a, b, fi = 0.35, fo = 0.35) { if (t < a || t > b) return 0; return Math.min(smooth(a, a + fi, t), 1 - smooth(b - fo, b, t)); }

// --- Luchten (tijdlijn) ---
const SKIES = [
  { t0: 0, t1: 15, top: '#3D8FE0', bot: '#CDEBFF', cloud: '#FFFFFF' },
  { t0: 15, t1: 16.5, top: '#232A3D', bot: '#56607A', cloud: '#8A93A6', name: 'THUNDERFRONT  ·  CHARGED x2', col: '#FFE55A' },
  { t0: 16.5, t1: 18, top: '#8EA9C0', bot: '#EAF3FA', cloud: '#F4F9FF', name: 'BLIZZARD  ·  FROZEN x3', col: '#D8F2FF' },
  { t0: 18, t1: 19.5, top: '#040E18', bot: '#0F3A44', cloud: '#2E5E66', name: 'AURORA  ·  PRISMATIC x6', col: '#7FFFD4' },
  { t0: 19.5, t1: 21, top: '#D9643A', bot: '#FFD08A', cloud: '#FFD9B0', name: 'GOLDEN HOUR  ·  GILDED x5', col: '#FFE27A' },
  { t0: 21, t1: 25, top: '#07030D', bot: '#2A1240', cloud: '#3A2A55' },
  { t0: 25, t1: 31, top: '#3D8FE0', bot: '#CDEBFF', cloud: '#FFFFFF' },
];
function skyAt(t) {
  let i = SKIES.findIndex(s => t >= s.t0 && t < s.t1); if (i < 0) i = SKIES.length - 1;
  const s = SKIES[i], prev = SKIES[Math.max(0, i - 1)];
  const x = i > 0 ? smooth(s.t0, s.t0 + 0.25, t) : 1;
  return { i, s, top: mixColor(prev.top, s.top, x), bot: mixColor(prev.bot, s.bot, x), cloud: mixColor(prev.cloud, s.cloud, x) };
}

// --- Opbouw ---
const bgClouds = [], seaClouds = [], worldClouds = [];
for (let i = 0; i < 8; i++) bgClouds.push({ e: el('use', { href: '#cloudShape' }, $('bgClouds')), x: rnd(i, 1) * 2200, y: 120 + rnd(i, 2) * 520, s: 0.6 + rnd(i, 3) * 0.9, o: 0.55 + rnd(i, 4) * 0.35 });
for (let i = 0; i < 9; i++) seaClouds.push({ e: el('use', { href: '#cloudShape' }, $('seaClouds')), x: i * 250 - 40, y: 1030 + rnd(i, 5) * 40, s: 1.8 + rnd(i, 6) * 0.9 });
for (let i = 0; i < 9; i++) worldClouds.push({ e: el('use', { href: '#cloudShape' }, $('worldClouds')), x: 700 + i * 300 + rnd(i, 7) * 120, y: -420 + rnd(i, 8) * 480, s: 1.0 + rnd(i, 9) * 1.2 });
const rain = [], snow = [], motes = [], stars = [], speed = [];
for (let i = 0; i < 150; i++) rain.push(el('line', {}, $('rain')));
for (let i = 0; i < 170; i++) snow.push(el('circle', { r: 2.5 + rnd(i, 11) * 4.5 }, $('snow')));
for (let i = 0; i < 70; i++) motes.push(el('circle', { r: 2 + rnd(i, 12) * 4 }, $('motes')));
for (let i = 0; i < 90; i++) stars.push(el('circle', { cx: rnd(i, 13) * 1920, cy: rnd(i, 14) * 640, r: 1 + rnd(i, 15) * 2.4, fill: '#FFFFFF' }, $('stars')));
for (let i = 0; i < 16; i++) speed.push(el('line', { 'stroke-width': 4 + rnd(i, 16) * 5 }, $('speedLines')));

function makeDriftling(parent, body, accent, glow, eyesDark) {
  const g = el('g', {}, parent);
  const glowC = el('circle', { r: 36, fill: glow, filter: 'url(#blur10)', opacity: 0.85 }, g);
  el('ellipse', { cx: -24, cy: -4, rx: 14, ry: 7, fill: accent, transform: 'rotate(-20 -24 -4)' }, g);
  el('ellipse', { cx: 24, cy: -4, rx: 14, ry: 7, fill: accent, transform: 'rotate(20 24 -4)' }, g);
  const b = el('circle', { r: 21, fill: body, stroke: 'rgba(0,0,0,.35)', 'stroke-width': 2.5 }, g);
  el('circle', { cx: -7, cy: -3, r: 4.2, fill: eyesDark || '#1A1A2A' }, g); el('circle', { cx: 7, cy: -3, r: 4.2, fill: eyesDark || '#1A1A2A' }, g);
  el('circle', { cx: -5.5, cy: -4.5, r: 1.4, fill: '#FFFFFF' }, g); el('circle', { cx: 8.5, cy: -4.5, r: 1.4, fill: '#FFFFFF' }, g);
  el('path', { d: 'M-4 5 Q0 8 4 5', fill: 'none', stroke: '#1A1A2A', 'stroke-width': 1.8 }, g);
  return { g, glowC, b };
}
// sier-Driftlings in de lucht (scène 2)
const decor = [
  { d: makeDriftling($('driftlings'), '#FFD84A', '#FFFFFF', '#FFF2A0'), x: 1290, y: 330 },
  { d: makeDriftling($('driftlings'), '#FF9AD0', '#FFFFFF', '#FFC4E6'), x: 1560, y: 450 },
  { d: makeDriftling($('driftlings'), '#9FE8FF', '#FFFFFF', '#CFF6FF'), x: 980, y: 260 },
];
// vang-Driftlings (scène 4)
const CATCH_T = [11.6, 12.4, 13.2, 14.0];
const catchCols = [['#FFD84A', '#FFF2A0'], ['#9FE8FF', '#CFF6FF'], ['#FF9AD0', '#FFC4E6'], ['#B58CFF', '#DCC8FF']];
const catches = CATCH_T.map((tc, i) => ({ tc, d: makeDriftling($('driftlings'), catchCols[i][0], '#FFFFFF', catchCols[i][1]), txt: el('text', { class: 't', 'font-size': 40, fill: '#FFE27A', stroke: '#1C3D6C', 'stroke-width': 8 }, $('popTexts')) }));
catches.forEach((c, i) => c.txt.textContent = ['+5/min', '+15/min', '+50/min', '+200/min'][i]);
// speciale Driftlings (scène 5 en 6), schermcoördinaten
const mutant = makeDriftling($('special'), '#FFE55A', '#FFFFFF', '#FFF06A');
const voidD = makeDriftling($('special'), '#2A0F45', '#6B2FA8', '#B05CFF', '#FF7AF0');
const MUT = { 1: ['#FFE55A', '#FFF06A'], 2: ['#CDEFFF', '#FFFFFF'], 3: ['#7FFFD4', '#B48CFF'], 4: ['#FFC63A', '#FFE08A'] };

// --- Pad van het poppetje (wereldcoördinaten) ---
const BH = { x: 300 + 241 * 1.3, y: 330 + 146 * 1.3 }; // spuitgat
function avatarPos(t) {
  if (t < 8.5) return { x: BH.x, y: BH.y - 2 };
  if (t < 10) { const u = t - 8.5; return { x: BH.x, y: BH.y - 2 - (900 * u - 300 * u * u) }; }
  return { x: BH.x + 450 * (t - 10), y: BH.y - 2 - 675 + 40 * (t - 10) };
}
function camera(t) {
  if (t < 7) return { x: 960, y: 540, z: 1 };
  if (t < 8.3) { const u = smooth(7, 8.3, t); return { x: lerp(960, BH.x, u), y: lerp(540, BH.y - 60, u), z: lerp(1, 2.0, u) }; }
  if (t < 15) {
    const a = avatarPos(t), u = smooth(8.3, 8.9, t);
    return { x: lerp(BH.x, a.x, u), y: lerp(BH.y - 60, a.y - 20, u), z: lerp(2.0, 1.45, smooth(10, 11.2, t)) };
  }
  return { x: 960, y: 540, z: 1 };
}

function setOpacity(id, o) { $(id).setAttribute('opacity', o.toFixed(3)); }
function popText(id, t, a, b, cx, cy) {
  const o = win(t, a, b, 0.2, 0.3); const s = easeOutBack((t - a) / 0.45);
  $(id).setAttribute('opacity', o.toFixed(3));
  $(id).setAttribute('transform', `translate(${cx} ${cy}) scale(${Math.max(0.01, s).toFixed(3)}) translate(${-cx} ${-cy})`);
}

function render(t) {
  const sky = skyAt(t);
  $('skyTop').setAttribute('stop-color', sky.top); $('skyBot').setAttribute('stop-color', sky.bot);
  const seg = sky.i;

  // zon, maan, eclips
  const sunUp = seg === 0 || seg === 6 || seg === 4 || seg === 2;
  setOpacity('sun', seg === 3 || seg === 1 ? 0 : 1);
  $('sun').setAttribute('fill', seg === 4 ? '#FFB24A' : '#FFE27A');
  const ecl = smooth(21.0, 22.2, t) * (t < 25 ? 1 : 0);
  $('moon').setAttribute('cx', lerp(1820, 1520, ecl).toFixed(1)); $('moon').setAttribute('cy', lerp(90, 210, ecl).toFixed(1));
  setOpacity('moon', t >= 21 && t < 25 ? 1 : 0);
  setOpacity('corona', t >= 21 && t < 25 ? smooth(21.8, 22.6, t) * (0.75 + 0.25 * Math.sin(t * 6)) : 0);

  // sterren en noorderlicht
  const starO = seg === 3 ? 1 : (seg === 5 ? 0.6 : 0);
  stars.forEach((s, i) => s.setAttribute('opacity', (starO * (0.5 + 0.5 * Math.sin(t * 3 + i))).toFixed(3)));
  setOpacity('aurora', seg === 3 ? 0.85 : 0);
  $('aurora').setAttribute('transform', `translate(${Math.sin(t * 1.3) * 60} ${Math.sin(t * 0.9) * 20})`);

  // achtergrondwolken (parallax met camera)
  const cam = camera(t);
  bgClouds.forEach((c, i) => {
    let x = ((c.x - t * 25 - (cam.x - 960) * 0.2) % 2200 + 2200) % 2200 - 140;
    const y = c.y - (cam.y - 540) * 0.2;
    c.e.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${c.s})`);
    c.e.setAttribute('fill', sky.cloud); c.e.setAttribute('opacity', (seg === 3 || seg === 5 ? c.o * 0.5 : c.o).toFixed(3));
  });

  // bliksem
  const lt = [15.25, 15.95].map(x => (t >= x && t < x + 0.25) ? 1 - (t - x) / 0.25 : 0);
  const lightning = Math.max(...lt);
  setOpacity('lightning', lightning);

  // wereld + camera
  $('world').setAttribute('transform', `translate(960 540) scale(${cam.z.toFixed(4)}) translate(${(-cam.x).toFixed(2)} ${(-cam.y).toFixed(2)})`);
  worldClouds.forEach(c => { c.e.setAttribute('transform', `translate(${c.x} ${c.y}) scale(${c.s})`); c.e.setAttribute('fill', '#FFFFFF'); c.e.setAttribute('opacity', t >= 8.5 && t < 15 ? 0.9 : 0); });

  // walvis
  let wx, wy, ws;
  if (t < 15) { wx = 300 + (1 - easeOutCubic((t - 3.0) / 1.8)) * 1900; if (t < 3) wx = 2200; wy = 330; ws = 1.3; }
  else if (t < 25) { wx = 380; wy = 470; ws = 1.12; }
  else { wx = 330; wy = 400; ws = 1.3; }
  const bob = Math.sin(t * 1.6) * 8;
  $('whaleWrap').setAttribute('transform', `translate(${wx.toFixed(1)} ${(wy + bob).toFixed(1)}) scale(${ws})`);

  // spuitgat-straal
  const bhx = wx + 241 * ws, bhy = wy + bob + 146 * ws;
  let sprayH = 0;
  if (t > 4.6 && t < 6.6) sprayH = Math.sin(clamp((t - 4.6) / 2.0, 0, 1) * Math.PI) * 110;
  if (t > 8.45 && t < 9.6) sprayH = Math.max(sprayH, Math.sin(clamp((t - 8.45) / 1.15, 0, 1) * Math.PI) * 170);
  if (t > 25.2 && t < 27.4) sprayH = Math.max(sprayH, Math.sin(clamp((t - 25.2) / 2.2, 0, 1) * Math.PI) * 120);
  const sp = (dx, h) => `M${bhx} ${bhy} C${bhx + dx * 0.1} ${bhy - h * 0.5} ${bhx + dx * 0.5} ${bhy - h * 0.85} ${bhx + dx} ${bhy - h}`;
  $('spray1').setAttribute('d', sp(-60, sprayH * 0.8)); $('spray2').setAttribute('d', sp(4, sprayH)); $('spray3').setAttribute('d', sp(64, sprayH * 0.78));
  setOpacity('sprayGroup', sprayH > 2 ? 0.95 : 0);

  // poppetje
  const a = avatarPos(t);
  const showAvatar = t >= 7.2 && t < 15;
  const tilt = t >= 10 ? 12 : 0;
  $('avatar').setAttribute('transform', `translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${tilt}) scale(1.8)`);
  setOpacity('avatar', showAvatar ? smooth(7.2, 7.5, t) : 0);
  const wingS = easeOutBack((t - 9.6) / 0.4);
  $('wings').setAttribute('transform', `translate(0 -23) scale(${Math.max(0.001, t < 9.6 ? 0 : wingS).toFixed(3)} 1) translate(0 23)`);

  // sier-Driftlings
  decor.forEach((d, i) => {
    const o = t < 7.5 ? smooth(3.4 + i * 0.2, 3.9 + i * 0.2, t) : 1 - smooth(7.5, 8.0, t);
    d.d.g.setAttribute('transform', `translate(${d.x} ${(d.y + Math.sin(t * 2 + i) * 10).toFixed(1)}) scale(1.6)`);
    d.d.g.setAttribute('opacity', o.toFixed(3));
  });
  // vang-Driftlings
  catches.forEach((c, i) => {
    const p = avatarPos(c.tc);
    const before = t < c.tc, since = t - c.tc;
    const s = before ? 1.7 : 1.7 * (1 + since * 3);
    const o = t < 10.2 ? 0 : (before ? smooth(10.2, 10.6, t) : 1 - smooth(0, 0.18, since));
    c.d.g.setAttribute('transform', `translate(${p.x} ${(p.y - 18 + Math.sin(t * 3 + i) * 6).toFixed(1)}) scale(${s.toFixed(3)})`);
    c.d.g.setAttribute('opacity', o.toFixed(3));
    const to = since >= 0 && since < 0.9 && t < 15 ? 1 - smooth(0.5, 0.9, since) : 0;
    c.txt.setAttribute('x', p.x + 20); c.txt.setAttribute('y', (p.y - 50 - since * 60).toFixed(1));
    c.txt.setAttribute('opacity', to.toFixed(3));
  });

  // snelheidslijnen tijdens de lancering
  const v = t > 8.5 && t < 10 ? 900 - 600 * (t - 8.5) : 0;
  speed.forEach((l, i) => {
    const x = rnd(i, 21) * 1920, len = 80 + rnd(i, 22) * 160;
    const y = ((rnd(i, 23) * 1400 + t * 2600) % 1400) - 200;
    l.setAttribute('x1', x); l.setAttribute('x2', x); l.setAttribute('y1', y); l.setAttribute('y2', y + len);
    l.setAttribute('opacity', (clamp(v / 900, 0, 1) * 0.55).toFixed(3));
  });

  // weer
  const rainOn = seg === 1 ? 1 : 0;
  rain.forEach((l, i) => {
    const x = rnd(i, 31) * 2100 - 90, y = ((rnd(i, 32) * 1250 + t * 1700) % 1250) - 80;
    l.setAttribute('x1', x); l.setAttribute('y1', y); l.setAttribute('x2', x - 14); l.setAttribute('y2', y + 46);
    l.setAttribute('opacity', (rainOn * 0.8).toFixed(2));
  });
  const snowOn = seg === 2 ? 1 : 0;
  snow.forEach((c, i) => {
    const sp = 120 + rnd(i, 41) * 140;
    const x = rnd(i, 42) * 1920 + Math.sin(t * 1.5 + i) * 25, y = ((rnd(i, 43) * 1180 + t * sp) % 1180) - 50;
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); c.setAttribute('opacity', (snowOn * 0.95).toFixed(2));
  });
  const moteOn = seg === 5 ? 1 : 0;
  motes.forEach((c, i) => {
    const x = rnd(i, 51) * 1920, y = 1100 - ((rnd(i, 52) * 1200 + t * (40 + rnd(i, 53) * 60)) % 1200);
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); c.setAttribute('opacity', (moteOn * (0.5 + 0.5 * Math.sin(t * 4 + i))).toFixed(3));
  });

  // wolkenzee onderin
  seaClouds.forEach((c, i) => {
    const x = ((c.x - t * 40) % 2250 + 2250) % 2250 - 120;
    const y = c.y - (cam.y - 540) * 0.6 * cam.z;
    c.e.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${c.s})`);
    c.e.setAttribute('fill', sky.cloud);
  });

  // eclips: donker + gloeiende ogen
  const dark = t >= 21 && t < 25 ? 0.55 * smooth(21, 21.8, t) : 0;
  setOpacity('darken', dark);
  const eye = { x: wx + 185 * ws, y: wy + bob + 236 * ws };
  $('eyeGlowC').setAttribute('cx', eye.x.toFixed(1)); $('eyeGlowC').setAttribute('cy', eye.y.toFixed(1));
  setOpacity('eyeGlow', dark > 0 ? (dark / 0.55) * (0.7 + 0.3 * Math.sin(t * 5)) : 0);

  // speciale Driftlings
  if (seg >= 1 && seg <= 4) {
    const m = MUT[seg];
    mutant.b.setAttribute('fill', m[0]); mutant.glowC.setAttribute('fill', m[1]);
    const local = t - SKIES[seg].t0;
    const s = 2.4 * easeOutBack(local / 0.35);
    mutant.g.setAttribute('transform', `translate(1180 ${(360 + Math.sin(t * 3) * 12).toFixed(1)}) scale(${Math.max(0.01, s).toFixed(3)})`);
    mutant.g.setAttribute('opacity', 1);
    mutant.glowC.setAttribute('r', (36 + 8 * Math.sin(t * 8)).toFixed(1));
  } else mutant.g.setAttribute('opacity', 0);
  const vs = easeOutBack((t - 22.8) / 0.5);
  voidD.g.setAttribute('transform', `translate(1040 ${(400 + Math.sin(t * 2.5) * 14).toFixed(1)}) scale(${Math.max(0.01, 3.0 * vs).toFixed(3)})`);
  voidD.g.setAttribute('opacity', t >= 22.8 && t < 25 ? 1 - smooth(24.7, 25, t) : 0);
  voidD.glowC.setAttribute('r', (40 + 10 * Math.sin(t * 7)).toFixed(1));

  // flitsen: overgang naar luchten, bliksem, titel
  let flash = Math.max(lightning * 0.7, t >= 15 && t < 15.35 ? 1 - (t - 15) / 0.35 : 0, t >= 25 && t < 25.4 ? 1 - (t - 25) / 0.4 : 0);
  if (t >= 29.4) flash = 0;
  setOpacity('flash', flash);

  // teksten
  setOpacity('c1', win(t, 0.3, 2.9, 0.4, 0.3));
  popText('c2', t, 1.5, 2.95, 960, 640);
  setOpacity('c3', win(t, 3.7, 6.9));
  setOpacity('c4', win(t, 7.4, 10.8));
  setOpacity('c5', win(t, 11.0, 14.85));
  setOpacity('c6', win(t, 15.2, 20.9, 0.3, 0.3));
  if (seg >= 1 && seg <= 4) { $('c7').textContent = SKIES[seg].name; $('c7').setAttribute('fill', SKIES[seg].col); }
  setOpacity('c7', seg >= 1 && seg <= 4 ? win(t, SKIES[seg].t0 + 0.05, SKIES[seg].t1, 0.15, 0.12) : 0);
  setOpacity('c8', win(t, 21.5, 24.9));
  popText('c9', t, 23.1, 24.9, 1460, 570);
  popText('c10', t, 25.3, 30.2, 960, 200);
  popText('c11', t, 26.2, 30.2, 960, 910);
  popText('c12', t, 27.0, 30.2, 960, 1015);
}
window.render = render;
render(0);
</script>
</body></html>
